[project]
name = "tripmind"
version = "0.1.0"
description = "旅游知识问答与行程规划服务（LangGraph + FastAPI + Milvus）"
requires-python = ">=3.12"
dependencies = [
    # 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    # 编排
    # 上界是刻意收的：代码用的是 StateGraph + add_conditional_edges(path_map) 这一代 API，
    # 放开约束会解析到 1.x。升级前先改 main_graph.py 与各节点的返回契约。
    "langgraph>=0.2.40,<0.7",
    "langchain-core>=0.3,<0.4",
    # 模型
    # 代码用 client.chat.completions.create，是 1.x 的客户端写法；2.0 起有破坏性变更。
    "openai>=1.50,<2",
    # 存储
    # utils/clients/milvus_utils.py 走 2.x 的 connections + Collection + AnnSearchRequest，
    # 3.0 换了主推接口，升级不能只改版本号。
    "pymilvus>=2.4.9,<3",
    "pymongo>=4.9",
    "minio>=7.2",
    # 文本与工具
    "jieba>=0.42",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "numpy>=1.26",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# 本地跑 BGE-M3 与 reranker 才需要，纯 API 模式可跳过
gpu = [
    "FlagEmbedding>=1.3,<2",
    "torch>=2.4",
    # FlagEmbedding 1.4 没适配 transformers 5.x
    "transformers>=4.45,<5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
# 这是服务应用而不是库：显式声明不打包项目本身，
# 免得 uv 去构建/安装 tripmind 这个包，只让它管第三方依赖。
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
